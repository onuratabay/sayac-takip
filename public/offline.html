<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sayaç Takip</title>
    <style>
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        color: #243329;
        background: #fff;
        font-family: sans-serif;
        text-align: center;
      }

      main {
        width: min(360px, calc(100% - 32px));
      }

      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }

      p {
        margin: 0 0 22px;
        color: #728077;
        font-size: 14px;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 7px;
        color: #fff;
        background: #418258;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Bağlantı kurulamadı</h1>
      <p>Sayaç Takip internet üzerinden çalışır. Bağlantınızı kontrol edip tekrar deneyin.</p>
      <a href="https://sayac-takip.onuratabay.com">Tekrar dene</a>
    </main>
  </body>
</html>
